<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>워크시트</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root { --line: #333; --sub: #666; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Malgun Gothic', sans-serif;
    color: #1a1a1a;
  }
  .sheet {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }
  .sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--line);
    padding-bottom: 12px;
    margin-bottom: 20px;
  }
  .sheet-header h1 { font-size: 1.4rem; margin: 0; }
  .name-date {
    font-size: 0.85rem;
    color: var(--sub);
    display: flex;
    gap: 16px;
  }
  .instructions {
    background: #f7f7f7;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 0.95rem;
  }
  .task {
    margin-bottom: 20px;
  }
  .task h2 {
    font-size: 1.05rem;
    margin-bottom: 8px;
  }
  .answer-space {
    border: 1px dashed #bbb;
    border-radius: 8px;
    min-height: 80px;
    margin-top: 8px;
  }
  .teacher-note {
    margin-top: 32px;
    border-top: 2px dashed #999;
    padding-top: 16px;
    font-size: 0.85rem;
    color: var(--sub);
  }
  @media print {
    .teacher-note { display: none; } /* Student Version 인쇄 시 숨김 */
    .answer-space { min-height: 100px; }
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="sheet-header">
      <h1>워크시트 제목</h1>
      <div class="name-date">
        <span>이름: ______</span>
        <span>날짜: ______</span>
      </div>
    </div>

    <div class="instructions">
      활동 안내문
    </div>

    <div class="task">
      <h2>1.</h2>
      <div class="answer-space"></div>
    </div>

    <div class="teacher-note">
      <strong>Teacher Note</strong>
      <p></p>
    </div>
  </div>
</body>
</html>
