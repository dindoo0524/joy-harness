<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카드</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }
  body {
    margin: 0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Malgun Gothic', sans-serif;
    background: #f4f4f4;
    padding: 24px;
  }
  .postcard {
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    aspect-ratio: 4 / 6;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .postcard .image-area {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #eee;
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .postcard h1 {
    font-size: 1.2rem;
    margin: 0 0 8px;
  }
  .postcard p {
    font-size: 0.95rem;
    color: #444;
    line-height: 1.6;
    margin: 0;
  }
  .postcard .footer {
    margin-top: 16px;
    font-size: 0.8rem;
    color: #888;
    text-align: right;
  }
  @media print {
    body { background: #fff; padding: 0; }
    .postcard { box-shadow: none; border: 1px solid #ccc; }
  }
</style>
</head>
<body>
  <div class="postcard">
    <div>
      <div class="image-area"></div>
      <h1>제목</h1>
      <p>내용</p>
    </div>
    <div class="footer"></div>
  </div>
</body>
</html>
