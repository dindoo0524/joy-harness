<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업 제목</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --ink: #1a1a1a;
    --sub: #5b5b5b;
    --line: #e5e5e5;
    --accent: #2f6fed;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Malgun Gothic', sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.6;
  }
  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }
  header.lesson-header {
    border-bottom: 3px solid var(--accent);
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  header.lesson-header h1 {
    font-size: 1.6rem;
    margin: 0 0 8px;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    color: var(--sub);
    font-size: 0.9rem;
  }
  section {
    margin-bottom: 28px;
  }
  section h2 {
    font-size: 1.15rem;
    border-left: 4px solid var(--accent);
    padding-left: 10px;
    margin-bottom: 12px;
  }
  .card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  ul, ol { padding-left: 1.2em; }
  @media (max-width: 480px) {
    .page { padding: 20px 14px 48px; }
    header.lesson-header h1 { font-size: 1.3rem; }
  }
  @media print {
    body { color: #000; }
    .page { max-width: none; padding: 0; }
    .card { break-inside: avoid; border-color: #999; }
    a[href]::after { content: ""; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="lesson-header">
      <h1>수업 제목</h1>
      <div class="meta">
        <span>대상: </span>
        <span>시간: </span>
        <span>주제: </span>
      </div>
    </header>

    <section>
      <h2>학습 목표</h2>
      <ul>
        <li></li>
      </ul>
    </section>

    <section>
      <h2>활동</h2>
      <div class="card">
        <h3></h3>
        <p></p>
      </div>
    </section>

    <section>
      <h2>준비물</h2>
      <ul>
        <li></li>
      </ul>
    </section>
  </div>
</body>
</html>
