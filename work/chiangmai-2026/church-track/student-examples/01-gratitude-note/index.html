<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감사노트 — Challenge Log 학생 예시</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/guide.css" />
</head>
<body>
  <main class="app">
    <header class="header-row">
      <h1 id="app-logo" class="app-logo" data-guide="app-logo">Challenge Log</h1>
      <div class="header-actions">
        <span id="app-badge" class="app-badge" data-guide="app-badge">7 DAY</span>
        <button id="btn-share" class="btn-share" type="button" data-guide="btn-share" aria-label="공유하기">
          <span class="material-symbols-outlined" aria-hidden="true">share</span>
        </button>
      </div>
    </header>

    <section id="mission-card" class="mission-card" data-guide="mission-card">
      <div class="mission-top">
        <div class="mission-copy">
          <p id="mission-category" class="mission-category" data-guide="mission-category"></p>
          <h2 id="mission-title" class="mission-title" data-guide="mission-title"></h2>
          <p id="mission-description" class="mission-description" data-guide="mission-description"></p>
        </div>
        <div id="mission-image" class="mission-image" data-guide="mission-image">
          <span class="material-symbols-outlined" aria-hidden="true"></span>
        </div>
      </div>

      <div id="progress-section" class="progress-section" data-guide="progress-section">
        <div id="progress-bar" class="progress-bar" data-guide="progress-bar">
          <div id="progress-fill" class="progress-fill" data-guide="progress-fill"></div>
        </div>
        <p id="progress-label" class="progress-label" data-guide="progress-label"></p>
      </div>
    </section>

    <section id="summary-section" class="summary-grid" aria-label="요약 카드">
      <article id="summary-card-1" class="summary-card" data-guide="summary-card-1">
        <span class="summary-value">0</span>
        <span class="summary-label">오늘 기록</span>
      </article>
      <article id="summary-card-2" class="summary-card" data-guide="summary-card-2">
        <span class="summary-value">0</span>
        <span class="summary-label">남은 도전</span>
      </article>
      <article id="summary-card-3" class="summary-card" data-guide="summary-card-3">
        <span class="summary-value">0</span>
        <span class="summary-label">연속 기록</span>
      </article>
    </section>

    <form id="record-form" class="record-form" data-guide="record-form">
      <input
        id="record-input"
        class="record-input-field"
        data-guide="record-input"
        type="text"
        placeholder="오늘의 도전을 입력하세요."
        aria-label="오늘의 도전 입력"
        autocomplete="off"
      />
      <button id="btn-add-record" class="btn-add-record" data-guide="btn-add-record" type="submit">
        추가
      </button>
    </form>

    <section id="record-list" class="record-list" data-guide="record-list" aria-live="polite"></section>

    <nav id="bottom-nav" class="bottom-nav" data-guide="bottom-nav" aria-label="하단 메뉴">
      <button id="btn-home" class="bottom-button" data-guide="btn-home" type="button">
        <span class="material-symbols-outlined" aria-hidden="true">home</span>
        <span class="bottom-button-label">홈</span>
      </button>
      <button id="btn-summary" class="bottom-button" data-guide="btn-summary" type="button">
        <span class="material-symbols-outlined" aria-hidden="true">monitoring</span>
        <span class="bottom-button-label">요약</span>
      </button>
      <button id="btn-record" class="bottom-button" data-guide="btn-record" type="button">
        <span class="material-symbols-outlined" aria-hidden="true">edit_note</span>
        <span class="bottom-button-label">기록</span>
      </button>
      <button id="btn-more" class="bottom-button" data-guide="btn-more" type="button">
        <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
        <span class="bottom-button-label">더보기</span>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite">
      <span id="toast-message" class="toast-message"></span>
      <button id="toast-action" class="toast-action" type="button" data-guide="toast-action" hidden></button>
    </div>

    <div id="confirm-dialog" class="confirm-overlay" data-guide="confirm-dialog" hidden>
      <div class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-message">
        <p id="confirm-message" class="confirm-message">정말 이 기록을 삭제할까요?</p>
        <div class="confirm-actions">
          <button id="confirm-cancel" class="confirm-btn confirm-btn-cancel" type="button" data-guide="confirm-cancel">취소</button>
          <button id="confirm-delete" class="confirm-btn confirm-btn-delete" type="button" data-guide="confirm-delete">삭제</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/demo-seed.js"></script>
  <script src="js/render.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
